# NewsBot Settings
# Sensitive values (API keys, email addresses) must be set in .env
# This file contains only non-sensitive configuration.

app:
  name: NewsBot
  timezone: America/New_York
  log_level: INFO

schedule:
  morning_digest:
    hour: 6
    minute: 0
    lookback_hours: 12
  evening_digest:
    hour: 18
    minute: 0
    lookback_hours: 12

topics:
  enabled: [politics, economy, current_events]
  current_events:
    max_stories: 5
  politics:
    max_stories: 10
  economy:
    max_stories: 5

geography:
  national: true
  state: north_carolina
  local: lee_county_nc
  local_boost: 1.5

# Story-level geo classification (replaces source-level region as primary signal)
# Keywords lists are case-insensitive substring matches (word-boundary for tokens <= 3 chars)
geo_filter:
  exclude_international: true
  keywords:
    local:
      - "lee county"
      - "sanford"
      - "harnett"
      - "broadway nc"
      - "angier"
      - "fuquay"
      - "chatham county"
    state:
      - "north carolina"
      - " nc "
      - "raleigh"
      - "charlotte"
      - "durham"
      - "chapel hill"
      - "wilmington nc"
      - "asheville"
      - "greensboro"
      - "winston-salem"
      - "fayetteville nc"
      - "cary nc"
    international:
      - "ukraine"
      - "russia"
      - "china"
      - "beijing"
      - "moscow"
      - "london"
      - "paris"
      - "berlin"
      - "tokyo"
      - "seoul"
      - "israel"
      - "gaza"
      - "iran"
      - "iraq"
      - "syria"
      - "india"
      - "pakistan"
      - "brazil"
      - "mexico"
      - "canada"
      - "australia"
      - "european union"
      - "nato"
      - "united nations"
      - "kremlin"

ingestion:
  request_timeout_seconds: 15
  max_retries: 3
  retry_backoff_seconds: 2
  cache_ttl_seconds: 3600
  user_agent: "NewsBot/1.0 (personal news aggregator; contact via github)"
  max_articles_per_source: 20
  request_delay_seconds: 1.5

deduplication:
  url_hash: true
  headline_similarity_threshold: 0.92

clustering:
  model: all-MiniLM-L6-v2
  # Lower threshold catches same-event stories written differently across outlets.
  # 0.65 is the recommended floor; go lower only if duplicates persist.
  similarity_threshold: 0.65
  # Articles published more than this many hours apart won't be merged,
  # even if semantically similar. Prevents topic-drift across days.
  max_age_delta_hours: 24
  min_sources_to_report: 1
  cross_tier_boost: true

bias:
  always_run_lexicon: true
  always_run_sentiment: true
  llm_escalation_threshold: 0.35
  llm_provider: perplexity
  llm_model: sonar
  llm_fallback: local
  llm_fallback_model: llama3
  # Perplexity API call cap per run. After this many Perplexity calls,
  # remaining clusters are routed to the local model automatically.
  # Set skip_after_cap: true to revert to the old skip behaviour.
  max_llm_calls_per_run: 20
  skip_after_cap: false

summarizer:
  provider: local
  model: llama3
  max_summary_tokens: 150
  neutral_prompt_version: v1
  request_timeout_seconds: 45
  connect_timeout_seconds: 10
  article_fetch_timeout_seconds: 15.0
  brave_enrich_threshold: 0.7
  max_concurrent_summaries: 5
  cluster_timeout_seconds: 120

# delivery structure:
#   delivery.<period>.email.enabled   -- per-period on/off switch
#   delivery.email.*                  -- email_sender.py + email_renderer.py
delivery:
  morning:
    email:
      enabled: true
    telegram:
      enabled: false
  afternoon:
    email:
      enabled: false
    telegram:
      enabled: false
  evening:
    email:
      enabled: true
    telegram:
      enabled: false

  email:
    max_recipients: 5
    # Max stories shown per geographic section (national / state / local)
    max_stories_per_category: 7
    subject_morning: "NewsBot Morning Briefing - {date}"
    subject_evening: "NewsBot Evening Briefing - {date}"
    bias_tag_colors:
      left:         "#1565c0"
      center-left:  "#1976d2"
      center:       "#388e3c"
      center-right: "#e64a19"
      right:        "#b71c1c"
      unknown:      "#757575"

  telegram:
    parse_mode: HTML

scheduler:
  schedule:
    morning: "0 6 * * *"
    evening: "0 18 * * *"

scoring:
  weights:
    source_count: 0.3
    local_tier: 1.5
    state_tier: 1.2
    national_tier: 1.0
    recency_decay: 0.05
