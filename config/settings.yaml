# NewsBot Settings
# Sensitive values (API keys, email addresses) must be set in .env
# This file contains only non-sensitive configuration.

app:
  name: NewsBot
  timezone: America/New_York
  log_level: INFO

storage:
  sqlite_path: data/newsbot.sqlite

schedule:
  morning_digest:
    hour: 6
    minute: 0
    lookback_hours: 12
  evening_digest:
    hour: 18
    minute: 0
    lookback_hours: 12

topics:
  enabled: [politics, economy, current_events]
  current_events:
    max_stories: 5
  politics:
    max_stories: 10
  economy:
    max_stories: 5

geography:
  profile: nc_lee_county
  national: true
  state: north_carolina
  local: lee_county_nc
  local_boost: 1.5
  labels:
    national: "National"
    state: "North Carolina"
    local: "Local - Lee County"

# Story-level geo classification (replaces source-level region as primary signal)
# Keywords lists are case-insensitive substring matches (word-boundary for tokens <= 3 chars)
geo_filter:
  exclude_international: true
  keywords:
    local:
      - "lee county"
      - "sanford"
      - "harnett"
      - "broadway nc"
      - "angier"
      - "fuquay"
      - "chatham county"
    state:
      - "north carolina"
      - " nc "
      - "raleigh"
      - "charlotte"
      - "durham"
      - "chapel hill"
      - "wilmington nc"
      - "asheville"
      - "greensboro"
      - "winston-salem"
      - "fayetteville nc"
      - "cary nc"
    international:
      - "ukraine"
      - "russia"
      - "china"
      - "beijing"
      - "moscow"
      - "london"
      - "paris"
      - "berlin"
      - "tokyo"
      - "seoul"
      - "israel"
      - "gaza"
      - "iran"
      - "iraq"
      - "syria"
      - "india"
      - "pakistan"
      - "brazil"
      - "mexico"
      - "canada"
      - "australia"
      - "european union"
      - "nato"
      - "united nations"
      - "kremlin"

ingestion:
  request_timeout_seconds: 15
  max_retries: 3
  retry_backoff_seconds: 2
  cache_ttl_seconds: 3600
  user_agent: "NewsBot/1.0 (personal news aggregator; contact via github)"
  max_articles_per_source: 20
  # Inter-request delay between feed fetches. Prevents IP bans and respects
  # implicit rate limits. Increase if any source starts returning 429s.
  request_delay_seconds: 1.5

deduplication:
  url_hash: true
  # Global within-source semantic dedup threshold (fallback when no per-tier
  # value is set). Articles from the SAME outlet with headline similarity
  # >= this value are collapsed.
  headline_similarity_threshold: 0.95
  # Per-tier within-source thresholds. Local outlets reuse similar phrasing
  # across follow-up stories; a lower threshold collapses these more
  # aggressively. State/national fall back to headline_similarity_threshold
  # if not set here.
  headline_similarity_threshold_by_tier:
    local: 0.85
    state: 0.92
    national: 0.95
  # Cross-source wire syndication threshold. Articles from DIFFERENT outlets
  # with similarity >= this value are treated as wire copy and collapsed.
  # Kept high (0.99) to avoid collapsing independent cross-source coverage.
  wire_syndication_threshold: 0.99

# Seen-story cache: persists url_hash values across digest runs so a story
# that appeared in Monday's briefing cannot reappear in Tuesday's unless
# ttl_days has elapsed. Uses a JSON file — no database dependency.
seen_story_cache:
  enabled: true
  path: data/seen_stories.json
  # Number of days a seen url_hash is remembered. Stories older than this
  # are eligible to reappear (e.g. long-running developing stories).
  ttl_days: 7

clustering:
  model: all-MiniLM-L6-v2

  # Lowered from 0.50 to 0.45.
  similarity_threshold: 0.45

  # Per-tier age window. Articles must be published within this window to
  # be merged into the same cluster.
  # local raised 24 → 48: local outlets post slowly; Day 1 story and Day 2
  # follow-up were falling outside the 24h window and appearing as two
  # separate briefing items.
  max_age_delta_hours:
    national: 72
    state: 48
    local: 48

  drop_singletons_below_importance: 0.1
  singleton_digest_floor: 0.1
  min_sources_to_report: 2
  cross_tier_boost: true

bias:
  always_run_lexicon: true
  always_run_sentiment: true
  llm_escalation_threshold: 0.35
  llm_provider: perplexity
  llm_model: sonar
  llm_fallback: local
  llm_fallback_model: llama3
  max_llm_calls_per_run: 20
  skip_after_cap: false

summarizer:
  provider: local
  model: llama3
  max_summary_tokens: 150
  neutral_prompt_version: v1
  request_timeout_seconds: 45
  connect_timeout_seconds: 10
  article_fetch_timeout_seconds: 15.0
  brave_enrich_threshold: 0.7
  cluster_timeout_seconds: 120
  max_concurrent_summaries: 3
  pplx_call_delay_seconds: 1.2
  pplx_max_calls_per_run: 15
  pplx_min_importance_score: 0.3
  pplx_retry_attempts: 3
  pplx_retry_base_delay: 2.0

# delivery structure:
#   delivery.<period>.email.enabled   -- per-period on/off switch
#   delivery.email.*                  -- email_sender.py + email_renderer.py
delivery:
  morning:
    email:
      enabled: true
    telegram:
      enabled: false
  afternoon:
    email:
      enabled: false
    telegram:
      enabled: false
  evening:
    email:
      enabled: true
    telegram:
      enabled: false

  email:
    max_recipients: 5
    max_stories_per_category: 7
    subject_morning: "NewsBot Morning Briefing - {date}"
    subject_evening: "NewsBot Evening Briefing - {date}"
    bias_tag_colors:
      left:         "#1565c0"
      center-left:  "#1976d2"
      center:       "#388e3c"
      center-right: "#e64a19"
      right:        "#b71c1c"
      unknown:      "#757575"

  telegram:
    parse_mode: HTML

scheduler:
  schedule:
    morning: "0 6 * * *"
    evening: "0 18 * * *"

scoring:
  weights:
    source_count: 0.3
    local_tier: 1.5
    state_tier: 1.2
    national_tier: 1.0
    recency_decay: 0.05
    normalization_ceiling: 5.0

monitoring:
  failure_alert_threshold: 3
  max_run_history_entries: 500
