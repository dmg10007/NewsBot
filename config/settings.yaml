# NewsBot Settings
# Sensitive values (API keys, email addresses) must be set in .env
# This file contains only non-sensitive configuration.

app:
  name: NewsBot
  timezone: America/New_York
  log_level: INFO

storage:
  sqlite_path: data/newsbot.sqlite

schedule:
  morning_digest:
    hour: 6
    minute: 0
    lookback_hours: 12
  evening_digest:
    hour: 18
    minute: 0
    lookback_hours: 12

topics:
  enabled: [politics, economy, current_events]
  current_events:
    max_stories: 5
  politics:
    max_stories: 10
  economy:
    max_stories: 5

geography:
  profile: nc_lee_county
  national: true
  state: north_carolina
  local: lee_county_nc
  local_boost: 1.5
  labels:
    national: "National"
    state: "North Carolina"
    local: "Local - Lee County"

# Story-level geo classification (replaces source-level region as primary signal)
# Keywords lists are case-insensitive substring matches (word-boundary for tokens <= 3 chars)
geo_filter:
  exclude_international: true
  keywords:
    local:
      - "lee county"
      - "sanford"
      - "harnett"
      - "broadway nc"
      - "angier"
      - "fuquay"
      - "chatham county"
    state:
      - "north carolina"
      - " nc "
      - "raleigh"
      - "charlotte"
      - "durham"
      - "chapel hill"
      - "wilmington nc"
      - "asheville"
      - "greensboro"
      - "winston-salem"
      - "fayetteville nc"
      - "cary nc"
    international:
      - "ukraine"
      - "russia"
      - "china"
      - "beijing"
      - "moscow"
      - "london"
      - "paris"
      - "berlin"
      - "tokyo"
      - "seoul"
      - "israel"
      - "gaza"
      - "iran"
      - "iraq"
      - "syria"
      - "india"
      - "pakistan"
      - "brazil"
      - "mexico"
      - "canada"
      - "australia"
      - "european union"
      - "nato"
      - "united nations"
      - "kremlin"

ingestion:
  request_timeout_seconds: 15
  max_retries: 3
  retry_backoff_seconds: 2
  cache_ttl_seconds: 3600
  user_agent: "NewsBot/1.0 (personal news aggregator; contact via github)"
  max_articles_per_source: 20
  # Inter-request delay between feed fetches. Prevents IP bans and respects
  # implicit rate limits. Increase if any source starts returning 429s.
  request_delay_seconds: 1.5

deduplication:
  url_hash: true
  # Within-source semantic dedup threshold. Articles from the SAME outlet
  # with headline similarity >= this value are collapsed. Raised from 0.92
  # to 0.95 to catch more wire-syndicated near-duplicates before they enter
  # clustering and inflate cluster count.
  headline_similarity_threshold: 0.95
  # Cross-source wire syndication threshold. Articles from DIFFERENT outlets
  # with similarity >= this value are treated as wire copy (AP/Reuters
  # republication) and collapsed. Must be higher than
  # headline_similarity_threshold to avoid collapsing legitimately similar
  # but independently written stories. Only reduce below 0.90 with caution.
  wire_syndication_threshold: 0.95

clustering:
  model: all-MiniLM-L6-v2

  # Tuned down from 0.82 to 0.50.
  # all-MiniLM-L6-v2 cosine scores for same-story articles across different
  # sources typically land in the 0.45-0.65 range. The old value of 0.82
  # was the primary cause of 289 clusters from 308 articles — nearly every
  # article became a singleton because legitimate same-story pairs scored
  # below the threshold. Start at 0.50 and dial up if over-merging occurs.
  similarity_threshold: 0.50

  # Per-tier age window. Articles must be published within this window to
  # be merged into the same cluster. National stories (slow-burn) get a
  # wider window; local stories (fast-cycling) get a tighter one.
  # Scalar values (e.g. max_age_delta_hours: 48) are still accepted for
  # backward compatibility and apply uniformly across all tiers.
  max_age_delta_hours:
    national: 72
    state: 48
    local: 24

  # Singleton clusters (1 article) with importance_score below this value
  # are dropped before digest selection. The durable pipeline then applies
  # a per-geography cap so useful single-source local/state/national stories
  # can still appear without flooding the email.
  drop_singletons_below_importance: 0.1

  # Minimum singleton score eligible for digest selection. The scorer applies
  # a 0.1 floor, so this keeps legitimate one-source stories available while
  # max_stories_per_category still caps email volume.
  singleton_digest_floor: 0.1

  min_sources_to_report: 2
  cross_tier_boost: true

bias:
  always_run_lexicon: true
  always_run_sentiment: true
  llm_escalation_threshold: 0.35
  llm_provider: perplexity
  llm_model: sonar
  llm_fallback: local
  llm_fallback_model: llama3
  # Perplexity API call cap per run. After this many calls,
  # remaining clusters are routed to the local model automatically.
  # Set skip_after_cap: true to hard-skip instead of routing to local.
  max_llm_calls_per_run: 20
  skip_after_cap: false

summarizer:
  provider: local
  model: llama3
  max_summary_tokens: 150
  neutral_prompt_version: v1
  request_timeout_seconds: 45
  connect_timeout_seconds: 10
  article_fetch_timeout_seconds: 15.0
  # Importance score threshold for Brave Search enrichment. Clusters at or
  # above this score get additional context snippets prepended to the LLM
  # input before summarization.
  brave_enrich_threshold: 0.7
  cluster_timeout_seconds: 120

  # --- Perplexity rate-limit controls ---
  max_concurrent_summaries: 3
  pplx_call_delay_seconds: 1.2
  pplx_max_calls_per_run: 15
  # Clusters below this importance score skip Perplexity and go straight to
  # the local model. Keeps API spend focused on high-value stories.
  pplx_min_importance_score: 0.3
  pplx_retry_attempts: 3
  pplx_retry_base_delay: 2.0

# delivery structure:
#   delivery.<period>.email.enabled   -- per-period on/off switch
#   delivery.email.*                  -- email_sender.py + email_renderer.py
delivery:
  morning:
    email:
      enabled: true
    telegram:
      enabled: false
  afternoon:
    email:
      enabled: false
    telegram:
      enabled: false
  evening:
    email:
      enabled: true
    telegram:
      enabled: false

  email:
    max_recipients: 5
    # Max stories shown per geographic section (national / state / local)
    max_stories_per_category: 7
    subject_morning: "NewsBot Morning Briefing - {date}"
    subject_evening: "NewsBot Evening Briefing - {date}"
    # HTML inline style colors for bias-lean tags in the email digest.
    # Configurable here so colour changes don't require touching Python.
    bias_tag_colors:
      left:         "#1565c0"
      center-left:  "#1976d2"
      center:       "#388e3c"
      center-right: "#e64a19"
      right:        "#b71c1c"
      unknown:      "#757575"

  telegram:
    parse_mode: HTML

scheduler:
  schedule:
    morning: "0 6 * * *"
    evening: "0 18 * * *"

scoring:
  weights:
    source_count: 0.3
    local_tier: 1.5
    state_tier: 1.2
    national_tier: 1.0
    recency_decay: 0.05
    # Raw score value that maps to importance_score = 1.0.
    # Raise this if weight tuning pushes raw scores above 5.0 and all
    # high-source clusters collapse to 1.0, losing relative distinction.
    # Formula: raw_score = source_count * source_count_weight * tier_multiplier
    # Example: 4 sources * 0.3 * 1.5 (local) = 1.8 -> 1.8/5.0 = 0.36
    normalization_ceiling: 5.0

monitoring:
  # Consecutive fetch failures before a WARNING is logged for a source.
  # Increase for unreliable local outlets; decrease for tier-1 national feeds.
  failure_alert_threshold: 3
  # Maximum number of digest run entries kept in run_history.json.
  # Older entries beyond this cap are trimmed on each append.
  # At 3 runs/day, 500 entries covers ~166 days of history.
  max_run_history_entries: 500
