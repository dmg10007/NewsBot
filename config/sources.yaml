# NewsBot Source Configuration
# Organized by geographic tier and topic relevance
# Topics: politics, economy, current_events
#
# Validated: May 2026
# Reuters dropped public RSS in 2020 — replaced with Google News site: feeds
# Axios has no native RSS — replaced with Google News site: feed
# WSJ RSS is paywalled — replaced with Google News site: feed
# AP News has no public RSS — replaced with Google News allinurl: proxy
# Fox Business moxie.foxnews.com deprecated — replaced with feeds.foxbusiness.com
# WRAL RSS paths from official WRAL RSS page (wral.com/about/wral-rss-feeds/)
# Charlotte Observer widget RSS dead — replaced with Google News proxy

national:
  rss:
    - name: AP News - Top Headlines
      url: https://news.google.com/rss/search?q=when:24h+allinurl:apnews.com&hl=en-US&gl=US&ceid=US:en
      bias_lean: center
      credibility: high
      topics: [politics, economy, current_events]
      note: "AP News has no public RSS; proxied via Google News allinurl filter"

    - name: AP News - Politics
      url: https://news.google.com/rss/search?q=when:24h+allinurl:apnews.com+politics&hl=en-US&gl=US&ceid=US:en
      bias_lean: center
      credibility: high
      topics: [politics]
      note: "Google News proxy"

    - name: AP News - Economy
      url: https://news.google.com/rss/search?q=when:24h+allinurl:apnews.com+business+economy&hl=en-US&gl=US&ceid=US:en
      bias_lean: center
      credibility: high
      topics: [economy]
      note: "Google News proxy"

    - name: Reuters - Top News
      url: https://news.google.com/rss/search?q=site:reuters.com&hl=en-US&gl=US&ceid=US:en
      bias_lean: center
      credibility: high
      topics: [politics, economy, current_events]
      note: "Reuters dropped public RSS in 2020; proxied via Google News"

    - name: Reuters - Politics
      url: https://news.google.com/rss/search?q=site:reuters.com+politics&hl=en-US&gl=US&ceid=US:en
      bias_lean: center
      credibility: high
      topics: [politics]
      note: "Google News proxy"

    - name: Reuters - Economy
      url: https://news.google.com/rss/search?q=site:reuters.com+economy+business&hl=en-US&gl=US&ceid=US:en
      bias_lean: center
      credibility: high
      topics: [economy]
      note: "Google News proxy"

    - name: NPR News
      url: https://feeds.npr.org/1001/rss.xml
      bias_lean: center-left
      credibility: high
      topics: [politics, economy, current_events]

    - name: NPR Politics
      url: https://feeds.npr.org/1014/rss.xml
      bias_lean: center-left
      credibility: high
      topics: [politics]

    - name: PBS NewsHour
      url: https://www.pbs.org/newshour/feeds/rss/headlines
      bias_lean: center-left
      credibility: high
      topics: [politics, economy, current_events]

    - name: Axios
      url: https://news.google.com/rss/search?q=site:axios.com&hl=en-US&gl=US&ceid=US:en
      bias_lean: center
      credibility: high
      topics: [politics, economy, current_events]
      note: "Axios has no native RSS; proxied via Google News"

    - name: The Hill
      url: https://thehill.com/rss/syndicator/19110
      bias_lean: center
      credibility: medium
      topics: [politics, economy]

    - name: Fox News - Politics
      url: https://moxie.foxnews.com/google-publisher/politics.xml
      bias_lean: right
      credibility: medium
      topics: [politics]

    - name: Fox News - Economy
      url: https://feeds.foxbusiness.com/foxbusiness/latest
      bias_lean: right
      credibility: medium
      topics: [economy]
      note: "moxie.foxnews.com/google-publisher/business.xml deprecated; moved to foxbusiness feed"

    - name: CNN - Politics
      url: http://rss.cnn.com/rss/cnn_allpolitics.rss
      bias_lean: center-left
      credibility: medium
      topics: [politics]

    - name: Wall Street Journal - Economy
      url: https://news.google.com/rss/search?q=site:wsj.com+economy+business&hl=en-US&gl=US&ceid=US:en
      bias_lean: center-right
      credibility: high
      topics: [economy]
      note: "WSJ native RSS is paywalled; proxied via Google News"

state:
  # North Carolina
  rss:
    - name: WRAL News
      url: http://www.wral.com/news/rss/48/
      bias_lean: center
      credibility: high
      topics: [politics, economy, current_events]
      region: north_carolina
      note: "Confirmed URL from wral.com/about/wral-rss-feeds/ (Top Stories)"

    - name: WRAL Politics
      url: http://www.wral.com/news/rss/35/
      bias_lean: center
      credibility: high
      topics: [politics]
      region: north_carolina
      note: "Confirmed URL from wral.com/about/wral-rss-feeds/ (Political News)"

    - name: NC Policy Watch
      url: http://www.ncpolicywatch.com/feed/
      bias_lean: center-left
      credibility: medium
      topics: [politics, economy]
      region: north_carolina

    - name: Carolina Public Press
      url: https://carolinapublicpress.org/feed/
      bias_lean: center
      credibility: high
      topics: [politics, economy, current_events]
      region: north_carolina

    - name: WCNC Charlotte
      url: https://www.wcnc.com/feeds/syndication/rss/news
      bias_lean: center
      credibility: medium
      topics: [politics, current_events]
      region: north_carolina

  scrapers:
    - name: Charlotte Observer
      url: https://www.charlotteobserver.com
      rss_url: https://news.google.com/rss/search?q=site:charlotteobserver.com&hl=en-US&gl=US&ceid=US:en
      bias_lean: center-left
      credibility: high
      topics: [politics, economy, current_events]
      region: north_carolina
      scraper_class: CharlotteObserverScraper
      note: "Legacy widget RSS dead; proxied via Google News"

local:
  # Lee County, NC
  scrapers:
    - name: Sanford Herald
      url: https://www.sanfordherald.com
      bias_lean: center
      credibility: medium
      topics: [politics, economy, current_events]
      region: lee_county_nc
      scraper_class: SanfordHeraldScraper
      selectors:
        article_list: "article.tnt-section-news, .tnt-asset-type-article"
        headline: "h3.tnt-headline a, h2.tnt-headline a"
        summary: "p.tnt-summary"
        link: "h3.tnt-headline a, h2.tnt-headline a"
        date: "time.tnt-date"

    - name: The Rant NC
      url: https://rantnc.com
      bias_lean: center
      credibility: medium
      topics: [politics, current_events]
      region: lee_county_nc
      scraper_class: RantNCScraper
      selectors:
        article_list: "article, .post"
        headline: "h2.entry-title a, h1.entry-title a"
        summary: ".entry-summary p, .entry-content p:first-of-type"
        link: "h2.entry-title a, h1.entry-title a"
        date: "time.entry-date, .post-date"
